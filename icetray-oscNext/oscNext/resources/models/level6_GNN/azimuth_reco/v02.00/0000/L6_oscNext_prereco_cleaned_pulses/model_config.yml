arguments:
  backbone:
    ModelConfig:
      arguments:
        add_global_variables_after_pooling: false
        dynedge_layer_sizes: null
        features_subset: null
        global_pooling_schemes: [min, max, mean, sum]
        nb_inputs: 4
        nb_neighbours: 8
        post_processing_layer_sizes: null
        readout_layer_sizes: null
      class_name: DynEdge
  gnn: null
  graph_definition:
    ModelConfig:
      arguments:
        columns: [0, 1, 2]
        detector:
          ModelConfig:
            arguments: {}
            class_name: IceCubeDeepCore
        dtype: torch.float32
        input_feature_names: [dom_x, dom_y, dom_z, dom_time]
        nb_nearest_neighbours: 8
        node_definition:
          ModelConfig:
            arguments: {input_feature_names: null}
            class_name: NodesAsPulses
        perturbation_dict: null
        seed: null
      class_name: KNNGraph
  optimizer_class: '!class torch.optim.adam Adam'
  optimizer_kwargs: {eps: 0.001, lr: 0.001}
  scheduler_class: '!class torch.optim.lr_scheduler ReduceLROnPlateau'
  scheduler_config: {frequency: 1, monitor: val_loss}
  scheduler_kwargs: {patience: 2}
  tasks:
  - ModelConfig:
      arguments:
        hidden_size: 128
        loss_function:
          ModelConfig:
            arguments: {}
            class_name: VonMisesFisher2DLoss
        prediction_labels: [azimuth_pred, azimuth_kappa_pred]
        target_labels: [azimuth]
      class_name: AzimuthReconstructionWithKappa
class_name: StandardModel
